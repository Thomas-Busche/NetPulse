# NetPulse – Produktivbetrieb auf NAS / Raspberry Pi / Linux-Server
#
# Alle Dienste nutzen das Host-Netzwerk. Nur so sieht NetPulse dein echtes LAN
# (ARP-Tabelle, Broadcasts). Datenbank und App lauschen nur auf 127.0.0.1,
# von außen erreichbar ist ausschließlich Caddy (HTTPS).
#
# Start:  docker compose up -d        (vorher .env aus .env.example anlegen)

name: netpulse

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${DB_PORT:-5433}
      - -c
      - timescaledb.telemetry_level=off
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}
      POSTGRES_DB: netpulse
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Nur die Rechte, die Postgres zum Start braucht (Dateirechte setzen, Benutzer wechseln)
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT:-5433} -U netpulse"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: netpulse:latest
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://netpulse:${DB_PASSWORD}@127.0.0.1:${DB_PORT:-5433}/netpulse
      LISTEN_ADDR: 127.0.0.1:${APP_PORT:-18080}
      SCAN_NETWORKS: ${SCAN_NETWORKS:-}
      DISCOVERY_INTERVAL_MIN: ${DISCOVERY_INTERVAL_MIN:-15}
      # Zeitzone für den Such-Zeitplan (z. B. „täglich 03:00“)
      TZ: ${TZ:-Europe/Berlin}
      # Empfang von Syslog-Meldungen und SNMP-Traps (UDP; 0 = aus)
      SYSLOG_PORT: ${SYSLOG_PORT:-5514}
      TRAP_PORT: ${TRAP_PORT:-1162}
      TRAP_COMMUNITY: ${TRAP_COMMUNITY:-}
      # Von wem Syslog/Traps angenommen werden: Netze (CIDR, Komma) oder "any"; leer = nur aus den Scan-Netzen
      SYSLOG_ALLOW: ${SYSLOG_ALLOW:-}
      RETENTION_SYSLOG_DAYS: ${RETENTION_SYSLOG_DAYS:-30}
      MONITOR_INTERVAL_SEC: ${MONITOR_INTERVAL_SEC:-60}
      RETENTION_METRICS_DAYS: ${RETENTION_METRICS_DAYS:-90}
      RETENTION_EVENTS_DAYS: ${RETENTION_EVENTS_DAYS:-180}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      INVENTORY_INTERVAL_MIN: ${INVENTORY_INTERVAL_MIN:-5}
      # Adresse im LAN – bei http:// wird das Anmelde-Cookie ohne „Secure“ gesetzt (sonst klappt die Anmeldung nicht)
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      # Für Links in Benachrichtigungen (Standard: SITE_ADDRESS)
      PUBLIC_URL: ${PUBLIC_URL:-${SITE_ADDRESS:-}}
      # true = alle Benutzer müssen 2FA nutzen (in der Oberfläche nicht abschaltbar); sonst unter Benutzer einstellbar
      REQUIRE_TOTP: ${REQUIRE_TOTP:-false}
      # Gültigkeit einer Anmeldung in Stunden
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # Tresor-Schlüssel fest vorgeben (64 Hex-Zeichen); leer = /data/secret.key
      SECRET_KEY: ${SECRET_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    # Minimale Rechte: nur NET_RAW für ICMP-Ping, Dateisystem schreibgeschützt
    volumes:
      # Enthält den Tresor-Schlüssel (secret.key) für gespeicherte Zugangsdaten – mitsichern!
      - app-data:/data
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs: [/tmp]

  proxy:
    image: caddy:2
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    network_mode: host
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost:8443}
      UPSTREAM: 127.0.0.1:${APP_PORT:-18080}
      # Eingang für Nginx Proxy Manager o. Ä. – am besten mit LAN-Adresse, z. B. http://192.168.1.10:18081
      # (unverschlüsseltes HTTP: Port nie am Router freigeben). Standard: nur lokal
      PROXY_LISTEN: ${PROXY_LISTEN:-http://127.0.0.1:18081}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
